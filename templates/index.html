<html>
<head>
<title>DRISH WEATHER</title>
<link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
</head>
<body>
    <h1 id="app-title">WEATHER</h1>
    <div class="search">
        <input id="searchcity" type="text" placeholder="Enter city name">
        <button id="searchbtn" class="search-button">search</button>
    </div>
    <div class="div1">
        <div id="main-info">
            <p id="today" ,>TODAY</p>
            <p id="datetime">--</p>
            <p id="city">--</p>
            <p id="temperature" class="temperature">--</p>
        </div>
        <div id="icon-container">
            <p id="weather-condition",>weather condition</p>
            <img id="weathericon">
            <p id="temp-feelslike">feels like: --</p>
        </div>
    </div>
    <div class="div2">
        <div class="box1">
            <h2 id="wind-speed-title">Wind Speed</h2>
            <p id="wind-speed">--</p>
            
        </div>
        <div class="box2">
            <h2 id="sunrise" font-family="Jura">Sunrise Time</h2>
            <p id="sunrisetime">--</p> 
            
        </div>
    </div>
    <div class="div3">
        <div class="box3">
            <h2 id="humidity-title">Humidity</h2>
            <p id="humidity">--</p>
        </div>
        <div class="box4">
            <h2 id="sunset" font-family="Jura">Sunset Time</h2>
            <p id="sunsettime">--</p> 
        </div>    
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
